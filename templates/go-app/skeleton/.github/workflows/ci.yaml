name: ci

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      APP: ${{ github.event.repository.name }}
      IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Bump image tag in gitops
        run: |
          DIR="gitops/apps/${APP}"
          if [ ! -d "$DIR" ]; then
            echo "::notice::${DIR} is not on gitops main yet. Merge the Backstage PR; it deploys :latest until the next push."
            exit 0
          fi
          cd "$DIR"
          kustomize edit set image "app=${IMAGE}:${GITHUB_SHA}"
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git commit -am "deploy ${APP} ${GITHUB_SHA::7}"
          git push
